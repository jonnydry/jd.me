<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'JBM'; font-weight: 400; src: url('{{fontDir}}/jetbrains-mono-latin-400-normal.woff2'); }
  @font-face { font-family: 'JBM'; font-weight: 500; src: url('{{fontDir}}/jetbrains-mono-latin-500-normal.woff2'); }
  @font-face { font-family: 'JBM'; font-weight: 600; src: url('{{fontDir}}/jetbrains-mono-latin-600-normal.woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: 'JBM', monospace;
    background: #0d1117;
    color: #e6edf3;
    position: relative;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .lines {
    position: absolute; inset: -10%;
    background:
      linear-gradient(-8deg, transparent 42%, hsl(212 100% 67% / 0.16) 42%, hsl(212 100% 67% / 0.16) 42.15%, transparent 42.15%),
      linear-gradient(-14deg, transparent 68%, hsl(212 100% 67% / 0.11) 68%, hsl(212 100% 67% / 0.11) 68.12%, transparent 68.12%),
      linear-gradient(-4deg, transparent 18%, hsl(212 100% 67% / 0.12) 18%, hsl(212 100% 67% / 0.12) 18.12%, transparent 18.12%),
      linear-gradient(-11deg, transparent 84%, hsl(212 100% 67% / 0.07) 84%, hsl(212 100% 67% / 0.07) 84.1%, transparent 84.1%);
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 70% at 12% 0%, hsl(212 82% 58% / 0.10), transparent 60%),
      radial-gradient(ellipse 50% 60% at 100% 100%, hsl(246 74% 48% / 0.08), transparent 60%);
  }
  .frame {
    position: absolute; inset: 40px;
    border: 1px solid #21262d;
    background: rgb(13 17 23 / 0.55);
    display: flex; flex-direction: column;
  }
  .bar {
    height: 44px; border-bottom: 1px solid #21262d;
    display: flex; align-items: center; padding: 0 20px; gap: 9px;
    font-size: 17px; color: #8b949e;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #21262d; }
  .bar-title { margin-left: 14px; opacity: 0.8; }
  .body {
    flex: 1; display: flex; align-items: center; gap: 56px;
    padding: 0 64px;
  }
  .avatar {
    width: 220px; height: 220px; border-radius: 50%; flex-shrink: 0;
    object-fit: cover;
    box-shadow: 0 0 0 2px #0d1117, 0 0 0 3px #30363d, 0 0 48px hsl(212 100% 67% / 0.16);
  }
  .text { min-width: 0; }
  .prompt { font-size: 24px; color: #8b949e; margin-bottom: 14px; }
  .prompt b { color: #58a6ff; font-weight: 500; }
  h1 { font-size: 86px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; margin-bottom: 24px; }
  .tagline { font-size: 25px; line-height: 1.5; color: #8b949e; max-width: 680px; }
  .cursor { color: #58a6ff; }
  .foot {
    height: 64px; border-top: 1px solid #21262d;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px; font-size: 19px; color: #8b949e;
  }
  .foot .projects span { color: #e6edf3; opacity: 0.82; }
  .foot .projects i { font-style: normal; color: #30363d; margin: 0 10px; }
  .foot .url { color: #58a6ff; font-weight: 500; }
</style>
</head>
<body>
  <div class="lines"></div>
  <div class="glow"></div>
  <div class="frame">
    <div class="bar">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="bar-title">~/{{host}}</span>
    </div>
    <div class="body">
      <img class="avatar" src="{{avatar}}" alt="" />
      <div class="text">
        <p class="prompt"><b>$</b> whoami</p>
        <h1>{{name}}</h1>
        <p class="tagline">{{tagline}}<span class="cursor">|</span></p>
      </div>
    </div>
    <div class="foot">
      <span class="projects">{{projects}}</span>
      <span class="url">{{host}}</span>
    </div>
  </div>
</body>
</html>
